/* One committed look: printed board game on a navy tabletop. Ink outlines, hard shadows, flat colour for depth. */

:root{--table:#2B3A8C;--deep:#10163A;--ink:#1A1A2E;--sun:#FFC53D;--mint:#2BB673;--rose:#FF7EB6;--sky:#2F6FE0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--table);color:var(--ink);font-family:Nunito,system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
body{background:radial-gradient(120% 80% at 50% 38%,#3A4BA8 0%,#2B3A8C 45%,#1B2466 100%)}
body::before{content:"";position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.2px,transparent 1.4px);background-size:12px 12px;pointer-events:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 16px 0;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.badge{pointer-events:auto;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:13px;letter-spacing:.08em;color:#fff;background:rgba(16,22,58,.55);border:2px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 11px 4px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.badge a{color:var(--sun);text-decoration:none}
.chips{display:flex;gap:6px}
.chip{display:flex;align-items:center;gap:6px;font-weight:900;font-size:13px;color:#fff;background:rgba(16,22,58,.55);border:2px solid rgba(255,255,255,.18);border-radius:999px;padding:4px 10px 4px 5px;transition:transform .25s,border-color .25s,background .25s}
.chip i{width:14px;height:14px;border-radius:50%;border:2px solid #fff;background:var(--c)}
.chip.on{transform:translateY(2px) scale(1.06);border-color:var(--c);background:rgba(16,22,58,.85)}
.dock{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;align-items:stretch;pointer-events:none}
.msg{align-self:center;font-weight:900;font-size:15px;color:#fff;text-shadow:0 2px 0 rgba(16,22,58,.6);min-height:22px;text-align:center;transition:opacity .3s}
.row{display:flex;gap:10px;pointer-events:auto}
button{-webkit-tap-highlight-color:transparent;font-family:"Lilita One",sans-serif;cursor:pointer}
.spin{flex:1;font-size:26px;letter-spacing:.04em;color:var(--ink);background:var(--sun);border:3px solid var(--ink);border-radius:14px;box-shadow:inset 0 -5px 0 rgba(26,26,46,.18),0 6px 0 var(--ink);padding:10px 0 12px;transition:transform .08s,box-shadow .08s,filter .2s}
.spin:active{transform:translateY(4px);box-shadow:inset 0 -5px 0 rgba(26,26,46,.18),0 2px 0 var(--ink)}
.spin:disabled{filter:saturate(.35) brightness(.85);cursor:default}
.sq{width:58px;font-size:13px;font-family:"Barlow Condensed",sans-serif;font-weight:800;letter-spacing:.06em;color:#fff;background:rgba(16,22,58,.7);border:3px solid var(--ink);border-radius:14px;box-shadow:0 6px 0 var(--ink)}
.sq.on{background:var(--mint);color:var(--ink)}
.sq:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
#fps{position:fixed;left:16px;bottom:calc(132px + env(safe-area-inset-bottom));font:700 11px/1 monospace;color:#C9D2FF;opacity:.7}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Lilita One",sans-serif;font-size:28px;color:#fff;letter-spacing:.06em;transition:opacity .6s}
#load.gone{opacity:0;pointer-events:none}
#err{position:fixed;inset:auto 16px 50% 16px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:16px;font-weight:800;display:none}
</style>

 if(o.group){const old=o.group;await tw(.18,t=>old.scale.setScalar(1-t));world.remove(old);}
 const g=new THREE.Group();const n=level===3?1:level;for(let k=0;k<n;k++){const h=houseMesh(level===3);h.position.x=n>1?(k-.5)*.22:0;g.add(h);}
 g.position.set(x,TILE_H,z-.28);world.add(g);o.group=g;SFX.build();burstCoins(new THREE.Vector3(x,0,z),8);
 await tw(.7,t=>{g.scale.setScalar(Math.max(.001,easeOutElastic(t)));g.position.y=TILE_H+(1-Math.min(1,t*2.2))*.9;});}
async function flipCard(){const c=deck.top;const start=new THREE.Vector3(0,.2,2.95);c.position.copy(start);c.rotation.set(-Math.PI/2,0,0);c.visible=true;SFX.flip();
 // fly up towards the camera and flip over
 const camDir=new THREE.Vector3(),end=new THREE.Vector3();const endAt=()=>{camera.getWorldDirection(camDir);end.copy(camera.position).addScaledVector(camDir,3.7);const up=new THREE.Vector3(0,1,0).applyQuaternion(camera.quaternion);end.addScaledVector(up,.12);return end;};
 const q0=new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.PI/2,Math.PI,0));
 const q1=new THREE.Quaternion();camera.getWorldQuaternion(q1);
 const qTmp=new THREE.Quaternion();
 await tw(.85,t=>{const e=easeInOut(t);c.position.lerpVectors(start,endAt(),e);c.position.y+=Math.sin(t*Math.PI)*.8;camera.getWorldQuaternion(q1);qTmp.slerpQuaternions(q0,q1,e);c.quaternion.copy(qTmp);});
 hold=()=>{c.position.copy(endAt());camera.getWorldQuaternion(c.quaternion);c.position.y+=Math.sin(clock.elapsedTime*2)*.015;};
 setMsg('Won the meat tray: +2 joy');SFX.ding();await wait(1500);hold=null;const from=c.position.clone(),qf=c.quaternion.clone(),qd=new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI/2,0,0));
 await tw(.5,t=>{const e=t*t;c.position.lerpVectors(from,start,e);c.position.y+=Math.sin(t*Math.PI)*.5;c.quaternion.slerpQuaternions(qf,qd,e);});c.visible=false;}
let hold=null;
async function takeTurn(){if(busy)return;busy=true;$('spin').disabled=true;ac();const p=pawns[turn],me=PLAYERS[turn];
 setMsg(`${me.name} is spinning…`);const n=await spinWheel();setMsg(`${me.name} spun ${n}!`);await wait(250);
 await hopPawn(p,n);const t=T[p.pos];const [x,z]=tileXZ(p.pos);const here=new THREE.Vector3(x,TILE_H,z);
 if(t.k==='prop'){const o=owned[p.pos];
  if(!o){owned[p.pos]={owner:turn,level:0,group:null,marker:ownerMarker(me.c)};const mk=owned[p.pos].marker;mk.position.set(x+.32,TILE_H+.02,z+.3);world.add(mk);
   SFX.coin(0);SFX.coin(1);setMsg(`${me.name} bought ${t.n.replace('\n',' ')}`);await tw(.5,e=>{mk.scale.setScalar(Math.max(.001,easeOutElastic(e)));});}
  else if(o.owner===turn){if(o.level<3){o.level++;setMsg(`${me.name} built ${['','a house','2 houses','a hotel'][o.level]}`);await popHouse(p.pos,o.level);}else setMsg(`${me.name} visits their hotel`);}
  else{const owner=pawns[o.owner];setMsg(`${me.name} pays rent to ${PLAYERS[o.owner].name}`);burstCoins(here,6+o.level*4,owner.g.position.clone().add(new THREE.Vector3(0,.4,0)));await wait(1400);}}
 else if(t.k==='life'){setMsg(`${me.name} drew a Life card`);await flipCard();}
 else if(t.k==='payday'||t.k==='hustle'||t.k==='promo'){burstCoins(here,10);setMsg(t.k==='hustle'?`${me.name}'s side gig paid off`:`${me.name} cashes in`);await wait(900);}
 else{setMsg(`${me.name} landed on ${KIND[t.k][0].toLowerCase()}`);await wait(600);}
 await wait(500);turn=(turn+1)%PLAYERS.length;chips();busy=false;$('spin').disabled=false;setMsg(auto?'':`${PLAYERS[turn].name}'s turn: tap SPIN`);if(auto)setTimeout(takeTurn,500);}
$('spin').onclick=takeTurn;
$('auto').onclick=()=>{auto=!auto;$('auto').classList.toggle('on',auto);if(auto&&!busy)takeTurn();};
$('snd').onclick=()=>{soundOn=!soundOn;$('snd').textContent=soundOn?'SOUND ON':'SOUND OFF';if(soundOn)ac();};
// seed a few properties so the board looks lived-in
function seed(){[[1,0,2],[3,0,1],[12,1,3],[17,2,1],[20,2,2]].forEach(([tile,ow,lv])=>{const [x,z]=tileXZ(tile);const o=owned[tile]={owner:ow,level:lv,group:null,marker:ownerMarker(PLAYERS[ow].c)};o.marker.position.set(x+.32,TILE_H+.02,z+.3);world.add(o.marker);
 const g=new THREE.Group();const n=lv===3?1:lv;for(let k=0;k<n;k++){const h=houseMesh(lv===3);h.position.x=n>1?(k-.5)*.22:0;g.add(h);}g.position.set(x,TILE_H,z-.28);world.add(g);o.group=g;});
 pawns[0].pos=0;pawns[1].pos=9;pawns[2].pos=16;layoutPawns(true);}

/* ---------------- main loop ---------------- */
const clock=new THREE.Clock();let frames=0,acc=0,slow=0,fpsOn=/fps/.test(location.search);if(fpsOn)$('fps').hidden=false;
function frame(){const dt=Math.min(clock.getDelta(),1/20);const time=clock.elapsedTime;
 for(let k=tweens.length-1;k>=0;k--){const w=tweens[k];w.t+=dt;if(w.t<0)continue;const t=Math.min(1,w.t/w.dur);w.fn(t);if(t>=1){tweens.splice(k,1);w.done&&w.done();}}
 // wheel flapper: kicked by pegs as they pass
 const W=wheel;const seg=Math.PI/5;const rel=((Math.PI/2-W.angle)%seg+seg)%seg;const pegIdx=Math.floor((Math.PI/2-W.angle)/seg);
 if(W.lastPeg==null)W.lastPeg=pegIdx;if(pegIdx!==W.lastPeg){W.lastPeg=pegIdx;SFX.tick();W.flapVel+=-(Math.sign(W.angle-(W.prevAngle??W.angle))||1)*14;}
 W.flapVel+=(-W.flapAng*260-W.flapVel*16)*dt;W.flapAng+=W.flapVel*dt;W.flapAng=Math.max(-.7,Math.min(.7,W.flapAng));W.flap.rotation.y=W.flapAng;W.prevAngle=W.angle;
 W.spin.rotation.y=W.angle;
 // pawns: idle breathing + landing squash recovery
 pawns.forEach((p,k)=>{if(!p.hop){p.squash*=Math.pow(.0005,dt);const s=1-p.squash*Math.cos(time*30)*.6;const br=1+Math.sin(time*2+k*1.7)*.012;p.inner.scale.set(1.3/Math.sqrt(s),1.3*s*br,1.3/Math.sqrt(s));}});
 // glow follows the active pawn
 const ap=pawns[turn];if(ap){const [x,z]=tileXZ(ap.hop?ap.pos:ap.pos);glow.position.lerp(tmpP.set(x,TILE_H+.006,z),1-Math.pow(.0001,dt));}
 glowMat.uniforms.uTime.value=time;sheenTime.value=time;
 for(let k=ripples.length-1;k>=0;k--){const r=ripples[k];r.t+=dt/.8;r.m.material.uniforms.uT.value=Math.min(1,r.t);if(r.t>=1){scene.remove(r.m);r.m.material.dispose();r.m.geometry.dispose();ripples.splice(k,1);}}
 updateCoins(dt);
 // camera: ease to drag target, drift back when idle
 idleT+=dt;if(!dragging&&idleT>2.5){azT*=Math.pow(.25,dt);elT+=(.98-elT)*(1-Math.pow(.25,dt));}
 const sway=Math.sin(time*.35)*.025;az+=(azT+sway-az)*(1-Math.pow(.002,dt));el+=(elT-el)*(1-Math.pow(.002,dt));
 if(!busy)focusT.lerp(target,1-Math.pow(.3,dt));camFocus.lerp(focusT,1-Math.pow(.05,dt));placeCam(dist);
 if(hold)hold();renderer.render(scene,camera);
 // adaptive resolution: if we're consistently slow, render fewer pixels
 frames++;acc+=dt;if(acc>=1){const fps=frames/acc;if(fpsOn)$('fps').textContent=fps.toFixed(0)+' fps · '+DPR.toFixed(2)+'x';
  if(fps<45&&DPR>1){slow++;if(slow>=2){DPR=Math.max(1,DPR-.25);renderer.setPixelRatio(DPR);renderer.setSize(innerWidth,innerHeight,false);slow=0;}}else slow=0;frames=0;acc=0;}}

(async()=>{try{
 await Promise.race([Promise.all(['120px "Lilita One"','800 40px "Barlow Condensed"','800 40px Nunito'].map(f=>document.fonts.load(f))),wait(2500)]);
 buildBoard();buildWheel();buildDeck();buildPawns();seed();chips();
 renderer.setSize(innerWidth,innerHeight,false);fit();placeCam(dist);
 renderer.compile(scene,camera);renderer.setAnimationLoop(frame);
 setTimeout(()=>$('load').classList.add('gone'),150);
 window.__ready=true;window.__demo={takeTurn,pawns,owned,wheel,setAuto:v=>{auto=v;}};
}catch(e){fail(e);}})();
